name: Auto-Delete Old Images

on:
  schedule:
    - cron: '0 * * * *'  # runs every hour
  workflow_dispatch:       # allows manual trigger too

jobs:
  delete-old-files:
    runs-on: ubuntu-latest
    steps:
      - name: Delete files older than 1 hour
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ''
            });

            const now = Date.now();
            const ONE_HOUR = 60 * 60 * 1000;
            const KEEP = ['README.md'];

            for (const file of files) {
              if (file.type !== 'file') continue;
              if (KEEP.includes(file.name)) continue;

              // Get commit history for this file to find its age
              const { data: commits } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: file.path,
                per_page: 1
              });

              if (!commits.length) continue;

              const lastCommitDate = new Date(commits[0].commit.committer.date).getTime();
              const ageMs = now - lastCommitDate;

              if (ageMs > ONE_HOUR) {
                await github.rest.repos.deleteFile({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: file.path,
                  message: `auto-cleanup: delete ${file.name} (older than 1 hour)`,
                  sha: file.sha
                });
                console.log(`Deleted: ${file.name} (${Math.round(ageMs/60000)} mins old)`);
              } else {
                console.log(`Kept: ${file.name} (${Math.round(ageMs/60000)} mins old)`);
              }
            }
